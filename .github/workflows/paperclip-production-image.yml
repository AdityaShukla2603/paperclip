
name: Paperclip Production Image

on:
  push:
    branches:
      - fix/setup-token-empty-lease-id-clean

permissions:
  contents: read
  packages: write

concurrency:
  group: paperclip-production-image
  cancel-in-progress: true

jobs:
  build-production-image:
    name: Build final production image
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare exact production source and apply fix
        shell: bash
        run: |
          set -euo pipefail

          git fetch https://github.com/paperclipai/paperclip.git \
            refs/tags/v2026.1023.0:refs/tags/v2026.1023.0

          git diff \
            f68e696a5ac1070766552831e7460375248877fe^ \
            f68e696a5ac1070766552831e7460375248877fe \
            -- \
            server/src/services/setup-token-session.ts \
            server/src/services/setup-token-reaper.test.ts \
            > /tmp/setup-token-fix.patch

          test -s /tmp/setup-token-fix.patch

          git checkout --detach v2026.1023.0
          git apply --check /tmp/setup-token-fix.patch
          git apply /tmp/setup-token-fix.patch
          git diff --check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: production
          tags: ghcr.io/adityashukla2603/paperclip:2026.1023.0-setup-token-fix
          build-args: |
            PAPERCLIP_BUILD_COMMIT=v2026.1023.0-setup-token-fix
