
name: Paperclip Production Patch Build

on:
  push:
    branches:
      - fix/setup-token-empty-lease-id-clean
permissions:
  contents: read

concurrency:
  group: paperclip-production-patch-build
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test production-version patch
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare exact production source and apply fix
        shell: bash
        run: |
          set -euo pipefail

          git fetch https://github.com/paperclipai/paperclip.git \
            refs/tags/v2026.1023.0:refs/tags/v2026.1023.0

          git diff \
            f68e696a5ac1070766552831e7460375248877fe^ \
            f68e696a5ac1070766552831e7460375248877fe \
            -- \
            server/src/services/setup-token-session.ts \
            server/src/services/setup-token-reaper.test.ts \
            > /tmp/setup-token-fix.patch

          test -s /tmp/setup-token-fix.patch

          git checkout --detach v2026.1023.0

          git apply --check /tmp/setup-token-fix.patch
          git apply /tmp/setup-token-fix.patch

          git diff --check
          git status --short

      - name: Build Paperclip
        run: |
          docker build \
            --target build \
            --build-arg PAPERCLIP_BUILD_COMMIT=v2026.1023.0-setup-token-fix \
            --tag paperclip-setup-token-fix:test \
            .

      - name: Run setup-token regression tests
        run: |
          docker run --rm \
            --entrypoint sh \
            paperclip-setup-token-fix:test \
            -lc 'cd /app/server && pnpm exec vitest run src/services/setup-token-reaper.test.ts'
